name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime_os: linux
            runtime_arch: x64
            ext: tar.gz
          - os: windows-2022
            runtime_os: windows
            runtime_arch: x64
            ext: zip
          - os: ubuntu-24.04-arm
            runtime_os: linux
            runtime_arch: arm64
            ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile sources
        shell: bash
        run: |
          rm -rf out dist runtime app.jar
          mkdir -p out dist
          javac src/*.java -d out

      - name: Create jar
        shell: bash
        run: |
          jar --create --file app.jar --main-class App -C out .

      - name: Compute modules
        shell: bash
        run: |
          MODS=$(jdeps \
            --multi-release 25 \
            --ignore-missing-deps \
            --recursive \
            --class-path out \
            --print-module-deps \
            app.jar)
          echo "MODS=$MODS" >> "$GITHUB_ENV"

      - name: Build runtime
        shell: bash
        run: |
          jlink \
            --add-modules "$MODS" \
            --output runtime \
            --strip-debug \
            --no-header-files \
            --no-man-pages \
            --compress=2

      - name: Package linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/server
          cp app.jar dist/server/
          cp -R runtime dist/server/
          tar -C dist/server -czf dist/server-${{ matrix.runtime_os }}-${{ matrix.runtime_arch }}.${{ matrix.ext }} .

      - name: Package windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\server | Out-Null
          Copy-Item app.jar dist\server\
          Copy-Item runtime dist\server\ -Recurse
          Compress-Archive -Path dist\server\* -DestinationPath dist\server-${{ matrix.runtime_os }}-${{ matrix.runtime_arch }}.${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.runtime_os }}-${{ matrix.runtime_arch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: server-linux-x64
          path: release-assets/linux-x64

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: server-windows-x64
          path: release-assets/windows-x64

      - name: Download Linux ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: server-linux-arm64
          path: release-assets/linux-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/linux-x64/*
            release-assets/windows-x64/*
            release-assets/linux-arm64/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}